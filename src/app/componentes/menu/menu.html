<!-- ============================================================
     NAVBAR — MERAKI Joyerías
     Estructura:
       [Logo]   [Nav links izquierda]   [Usuario + Logout derecha]
     ============================================================ -->

<header class="navbar">

  <!-- ── LOGO ── -->
  <h2 class="logo" [routerLink]="'/principal'">
    MERAKI <span>JOYERÍAS</span>
  </h2>

  <!-- ── LINKS DE NAVEGACIÓN (centro-izquierda) ── -->
  <nav class="nav-links">

    <button class="btn-nav" [routerLink]="'/principal'">
      Productos
    </button>

    <button class="btn-nav" [routerLink]="'/principal/publicar-producto'">
      Publicar Producto
    </button>

    @if (usuarioActual?.rol === 'administrador') {
      <button class="btn-nav" [routerLink]="'/principal/administrar-usuarios'">
        Administrar Usuarios
      </button>
    }

  </nav>

  <!-- ── ÁREA DE USUARIO (derecha) ── -->
  <div class="nav-usuario">
    <span class="usuario-nombre">👤 {{ usuarioActual?.nombre }}</span>
    <button class="btn-logout" (click)="cerrarSesion()">Cerrar sesión</button>
  </div>

</header>
