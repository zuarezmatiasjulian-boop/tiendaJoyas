<!-- Tarjeta elegante de joyería -->
<!-- appHoverColor → directiva personalizada: cambia el fondo al pasar el mouse -->
<div class="joya-card" appHoverColor>


  <!-- Imagen del producto -->
  <div class="joya-card__imagen-wrap">
    <img class="joya-card__imagen" [src]="joya.imagen" [alt]="joya.nombre" />
    <!-- Badge de categoría sobre la imagen -->
    <span class="joya-card__categoria">{{ joya.categoria }}</span>
  </div>

  <!-- Información del producto -->
  <div class="joya-card__info">
    <h3 class="joya-card__nombre">{{ joya.nombre }}</h3>

    <p class="joya-card__precio">{{ joya.precio | currency:'ARS':'symbol':'1.0-0' }}</p>

    <!-- Stock disponible oculto (si el producto está publicado en la vista significa que hay stock) -->
    <!--
    <p class="joya-card__stock">
      Stock disponible: <strong>{{ joya.stock }}</strong>
    </p>
    -->

    <!-- Botón que emite el evento al Padre -->
    <button class="joya-card__btn" (click)="onAgregar()" [disabled]="joya.stock === 0">
      Agregar al Carrito
    </button>
  </div>

</div>
